plugins {
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}
version = mod_version
group = mod_group
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { resenhaboost { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
repositories { }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}
processResources {
    def replaceProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
        minecraft_version: minecraft_version, forge_version: forge_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}
jar {
    manifest { attributes(['Specification-Title': mod_name, 'Specification-Vendor': mod_authors, 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion]) }
}